name: Binance Monitor

on:
  workflow_dispatch:

concurrency:
  group: binance-monitor
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: pip install requests pandas

      - name: Test Binance
        run: |
          echo "Testing Binance Futures..."
          curl -I --max-time 10 https://fapi.binance.com/fapi/v1/ping || true

      - name: Run
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
        run: python monitor.py
